<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Blackjack</h1>
        <p class="subtitle">Deal a hand, choose ace values, then hit or stay. Dealer stands on 17.</p>
        <p id="bankrollStatus" class="bankroll">Bankroll: $100 | Current Bet: $10</p>

        <section class="table">
            <div class="hand">
                <div class="hand-header">
                    <h2>Player</h2>
                    <strong id="playerScore" class="score">Total: -</strong>
                </div>
                <div id="playerCards" class="cards"></div>
            </div>

            <div class="hand">
                <div class="hand-header">
                    <h2>Dealer</h2>
                    <strong id="dealerScore" class="score">Total: -</strong>
                </div>
                <div id="dealerCards" class="cards"></div>
            </div>

            <div class="controls">
                <button id="dealButton" type="button">Deal</button>
                <button id="hitButton" type="button" disabled>Hit</button>
                <button id="stayButton" type="button" disabled>Stay</button>
            </div>

            <h2 id="winningScore" class="status">Ready for the next hand</h2>
            <p id="roundDetails" class="details">Start a hand to play. You can change each ace between 1 and 11 before you hit or stay.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
